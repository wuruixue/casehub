name: api-tests
on:
  push:
  schedule:
    - cron: "0 2 * * *"   # 每天凌晨定时回归
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -m smoke
      - run: pytest
